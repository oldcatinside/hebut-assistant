name: QingPing v1.2 APK
on:
  push:
    branches: [qingping-apk-build-20261021]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract sources
        run: |
          base64 -d qingping-build-source.tar.xz.b64 > source.tar.xz
          mkdir -p qingping-project
          tar -xJf source.tar.xz -C qingping-project
      - name: Apply v1.2 fixes
        run: python3 apply_qingping_patch.py
      - name: Install SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        working-directory: qingping-project
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QingPing-v1.2-debug-APK
          path: qingping-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

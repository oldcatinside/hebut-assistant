name: QingPing Android APK
on:
  push:
    branches:
      - qingping-apk-build-20261021
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract checked source
        shell: bash
        run: |
          base64 -d qingping-build-source.tar.xz.b64 > qingping-build-source.tar.xz
          echo "0736b2336ffbce86c37b5d217906b77b369c2a3692b68dcf17cef3d18b0ff89c  qingping-build-source.tar.xz" | sha256sum -c -
          mkdir -p qingping-project
          tar -xJf qingping-build-source.tar.xz -C qingping-project
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble signed debug APK
        working-directory: qingping-project
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QingPing-debug-APK
          path: qingping-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
